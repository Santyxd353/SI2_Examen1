name: Desplegar en Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Etiqueta opcional de la imagen
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Desplegar infraestructura e imagen
        shell: pwsh
        env:
          AZURE_POSTGRES_PASSWORD: ${{ secrets.AZURE_POSTGRES_PASSWORD }}
          AZURE_JWT_SECRET: ${{ secrets.AZURE_JWT_SECRET }}
        run: >-
          ./scripts/deploy-azure.ps1
          -SubscriptionId '${{ secrets.AZURE_SUBSCRIPTION_ID }}'
          -ResourceGroup '${{ vars.AZURE_RESOURCE_GROUP || 'rg-vestidor18' }}'
          -Location '${{ vars.AZURE_LOCATION || 'eastus2' }}'
          -Prefix '${{ vars.AZURE_PREFIX || 'vestidor18' }}'
          -ImageTag '${{ inputs.image_tag || github.sha }}'
